- name: Gideon's Tamagot(s)chi
  icon: "🐣"
  slug: tamagotschi
  app_icon: "assets/icons/tamagotschi/icon.svg"
  description: "Dein retro-pastellfarbenes Taschenhaustier für Android – mit Herz, Eigenleben & Klammer-s: füttern, spielen, pflegen – vom Baby bis zum gekrönten Erwachsenen."
  long_description: "Retro-Pastell-Tamagotchi für Android (Kotlin + Jetpack Compose): Ein kleiner pinker Pixel-Blob namens Gideon wohnt auf deinem Telefon. Füttere dein Pet, spiel mit ihm, bade und pflege es – bei Vernachlässigung wird es erst bockig, dann krank, bei Gesundheit 0 ist Game Over. Bei liebevoller Pflege wächst es vom Baby über Kind und Teenager zum gekrönten Erwachsenen. 100 % lokal (Room + DataStore), mit Hintergrund-Ticks via WorkManager."
  features:
    - "Pet-Brutstation: Name (inkl. Zufalls-Namensgenerator), Spezies (Blob, Keks, Stern) und 8 leuchtende Farben mit animierter Live-Vorschau"
    - "Retro-Handheld-Habitat: Tamagotchi-Gehäuse mit pulsierender Status-LED, animiertem Tag-/Nacht-/Krank-Himmel, Wolken, Sternen, Wiesenblumen und LCD-Scanline-Textur"
    - "Lebendige Emotionen: blinzelnde Augen, Atem-Squash-&-Stretch, Mimik für glücklich/hungrig/müde/krank/schlafend … plus Streichel-Reaktion beim Antippen"
    - "Evolution & Accessoires: Baby → Kind → Teenager → Erwachsener mit schwebender Goldkrone & Aura"
    - "5 Pflege-Aktionen (Füttern, Spielen, Waschen, Schlafen/Aufwecken, Medizin) mit eigenen Partikel-Effekten und Sound-Feedback"
    - "Dashboard mit animierter Gesundheits-Hauptleiste (Puls-Warnung < 30 %) und 2×2-Karten für Hunger, Glück, Energie & Sauberkeit"
    - "Lebt im Hintergrund weiter: Vordergrund-Tick alle 60 s, WorkManager alle 15 min inkl. „Während du weg warst…“-Rückblick; Benachrichtigungen bei Hunger, schlechter Gesundheit oder Heimweh"
    - "Atmosphärischer Game-Over-Screen mit Geister-Pet & Heiligenschein; signierte APK/AAB-Releases via GitHub Actions"
  language: Kotlin
  repo: "https://github.com/gschmalzhaf-cell/Gideon-s-Tamagotschi"
  website: ""
