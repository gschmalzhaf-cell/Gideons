  repo: "https://github.com/gschmalzhaf-cell/Einkaufsliste"
  website: ""

- name: Gideon's Putzplan
  icon: "🧹"
  slug: putzplan
  app_icon: "assets/icons/putzplan/icon.svg"
  description: "Native Android-App für den Putzplan – komplett offline. Wochenplan, Lern-Logik für Dauerschätzungen und Foto-Analyse per Mistral Vision."
  long_description: "Native Android-App für den Putzplan – ohne Server, komplett offline-fähig. Alle Daten liegen lokal in einer Room-Datenbank auf dem Gerät. Mit Lern-Logik für realistische Dauerschätzungen und optionaler Foto-Analyse der Wohnung per Mistral Vision."
  features:
    - "Wochenplan mit allen fälligen/überfälligen Aufgaben, filterbar nach Raum; Abhaken mit Dauer-Eingabe"
    - "Lern-Logik: gleitender Durchschnitt der tatsächlichen Dauer, Anpassung bei Über-/Unterschätzung (×1,1 bzw. ×0,9), nach 3× Überspringen automatisch selteneres Intervall"
    - "Foto-Analyse mit Mistral Vision: Foto aufnehmen → Aufgaben mit Priorität, Dauer und Hilfsmitteln → per Klick in den Plan übernehmen"
    - "Verlauf & Statistik: erledigte Aufgaben pro Raum, letzte Aktionen"
    - "Komplett offline, alle Daten lokal in Room; signierte Releases automatisch bei Tag-Push (v*) mit generiertem Changelog"
  language: Kotlin
  repo: "https://github.com/gschmalzhaf-cell/putzplan"
  website: ""
