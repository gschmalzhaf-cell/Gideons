- name: Gideon's Bücherwelt
  icon: "📚"
  slug: buecherwelt
  app_icon: "assets/icons/buecherwelt/icon.png"
  description: "Deine intelligente, 100 % lokale Android-Bibliothek – zum Verwalten deiner Büchersammlung, Erkennen von Buchreihen & Universen, Analysieren deiner Lese-DNA und Entdecken neuer Lieblingsbücher."
  long_description: "Intelligente, 100 % lokale Android-Bibliothek (Kotlin + Jetpack Compose, MVVM): Alle Daten liegen lokal in Room/DataStore – kein Account, keine Cloud. Netzwerk wird nur für Buchdaten-/Cover-Abfragen (ISBN, ASIN, Amazon-Kurzlinks, Titel-Suche) und optionale KI-Aufrufe mit deinem eigenen API-Key genutzt."
  features:
    - "Schnelles Erfassen: ISBN-/Barcode-Scan per Kamera, ISBN/ASIN/Amazon-Kurzlinks, Cover-Scanner (OCR + KI), Multi-Quellen-Suche (Google Books, Open Library, Audnex, Apple Books, Goodreads), Duplikat-Erkennung, StoryGraph-CSV-Import, Hintergrund-Anreicherung"
    - "Bibliotheks-Intelligenz offline: Smart-Suche mit Stimmungs-Chips („ungelesen & düster“), Reihen- & Universums-Erkennung, Reihen-Wächter & Lücken-Check, lokale Buch-Analyse (Stimmungen, Pacing, Schauplätze, geschätzte Lesezeit, Tropes, Spice-Level), „Ähnliche Bücher im eigenen Regal“ mit Match-Prozent"
    - "Metadaten & Tropes: 70+ kuratierte Tropes nach Kategorien, Autovervollständigung, Bewertung 1–5, Spice 0–5, Lesestatus, Notizen, Lesepult, Serien-/Universums-Verknüpfung auf der Detailseite, Cover direkt ersetzen"
    - "Entdecken & SuB-Berater: stimmungsbasierte Sortierung ungelesener Bücher nach Profil-Passgenauigkeit, regelbasierte & KI-Empfehlungen mit KI-Re-Ranking, Merkliste"
    - "Lese-Chronik & Lese-DNA: Lese-Archetyp (Exlibris), geschätzte Lesestunden, Reihen-Fortschrittsbalken, Dashboards (Top-Tropes, Lieblingsautor:innen, Ø Bewertung/Spice, „Weniger beliebt“, Ehrenregal 4–5★)"
    - "Diagnose & Datenschutz: lokaler App-Report als Markdown/JSON – API-Keys werden automatisch redacted"
    - "Kotlin 2.4, Compose Material 3, Room (Schema v4), DataStore, Retrofit 3 / OkHttp 5, Coil 3, CameraX + ML Kit"
  language: Kotlin
  repo: "https://github.com/gschmalzhaf-cell/Gideon-s-B-cherwelt"
  website: ""

- name: Gideon's Übersetzer
  icon: "🌐"
  slug: uebersetzer
  app_icon: "assets/icons/uebersetzer/icon.png"
  description: "Fremdsprachige Bücher und Dokumente (PDF, EPUB, DOCX – EN/FR/ES/IT mit Auto-Erkennung) lokal ins Deutsche übersetzen – als einsprachiges oder zweisprachiges EPUB 3 für den Tolino. Standard: 100 % offline."
  long_description: "Windows-Desktop-Anwendung mit CLI, die fremdsprachige Dokumente (PDF, EPUB, DOCX; Englisch, Französisch, Spanisch, Italienisch mit automatischer Spracherkennung) lokal ins Deutsche übersetzt und daraus ein sauberes EPUB 3 (einsprachig oder zweisprachig) für den Tolino-E-Book-Reader erzeugt. Standardmäßig läuft alles 100 % offline – kein Buchinhalt verlässt den Rechner."
  features:
    - "3-Schritte-Bedienung mit Warteschlange (Drag & Drop), Fortschrittsbalken mit Restdauer-Schätzung, Live-Textprobe und Protokoll; Abbrechen & Fortsetzen aus dem Zwischenspeicher"
    - "Mehrere Ausgangssprachen mit Auto-Erkennung (EN/FR/ES/IT), Stil- & Genre-Profile (Roman, Sachbuch, Fachbuch), automatisches Buch-Glossar für konsistente Eigennamen"
    - "Zweisprachiges EPUB (Original + Übersetzung untereinander), gezieltes Nachübersetzen fehlgeschlagener Abschnitte, automatische PDF-Bereinigung (Kopf-/Fußzeilen, Silbentrennung), deutsche Kapitelüberschriften im Inhaltsverzeichnis"
    - "Offline-Modelle via llama.cpp: Qwen2.5-7B (Standard), TranslateGemma-12B (Qualität), TranslateGemma-4B (kompakt); lokales OCR (RapidOCR) für gescannte PDFs"
    - "Optionaler Online-Notnagel: Mistral-API + Mistral OCR – nur nach bewusstem Einschalten mit eigenem API-Key, nie automatisch"
    - "Kuscheliges saisonales Design (Herbst/Winter/Frühling/Sommer, Hell/Dunkel) abgestimmt mit Installer & App-Icon; CLI u. a. für Warteschlange, Retry, Report, Update"
    - "PyInstaller + Inno-Setup-Installer; CI baut signierte Builds bei jedem Push/Tag"
  language: Python
  repo: "https://github.com/gschmalzhaf-cell/Gideon-s-bersetzer"
  website: ""

- name: Gideon's Notizen
  icon: "📝"
  slug: notizen
  app_icon: "assets/icons/notizen/icon.png"
  description: "Open-Source Meeting-Notizen für macOS und Windows: Bildschirmaufnahme, Zeitstempel-Wiedergabe, lokale KI und optional Mistral API – kein Konto nötig."
  long_description: "Local-first Meeting-Notizen für macOS und Windows mit eigenem cozy-blauem Design und eigenem App-Icon: Screen und Meeting-Audio aufnehmen, bearbeitbare Notizen erhalten – per Klick auf einen Zeitstempel springst du zur Wiedergabe genau dieses Moments. Transkription, Notizen und Ask AI laufen lokal auf deinem Rechner (Ollama) oder optional über die Mistral API. Kein Konto, kein API-Key nötig (außer im optionalen Online-Modus)."
  features:
    - "On-device-Transkription über lokales Ollama – 27 Meeting-Sprachen; optional eigener Mistral-API-Key für Notizen & Ask AI"
    - "Multi-Track-Aufnahme: Screen, Mikrofon („Me“) und System-Audio („Them“) als getrennte Streams"
    - "Replay: Klick auf einen Zeitstempel in den Notizen springt zum entsprechenden Videomoment"
    - "Bearbeitbare Notizen mit wählbaren Protokoll-Typen; Export als PDF, Word oder Markdown"
    - "Ask AI über alle Meetings hinweg – on-device oder via Mistral API"
    - "Kalender (Google/Microsoft) mit Auto-Record (Off/Once/Series) und Meeting-Erkennung für Zoom, Meet, Teams, Webex, Slack"
    - "Volltextsuche über alle Transkripte mit Deep-Links; AES-256-GCM-Verschlüsselung at rest (Keychain/DPAPI)"
    - "Fork-Features: Launch-at-Login als sichtbarer Toggle, Ein-Klick-Diagnosebericht (Markdown), In-App-Updates über die Releases dieses Repos"
  language: TypeScript
  repo: "https://github.com/gschmalzhaf-cell/AutoDoc"
  website: ""

- name: Gideon's RömerPlant
  icon: "🌿"
  slug: roemerplant
  app_icon: "assets/icons/roemerplant/icon.svg"
  description: "Private, lokal arbeitende Android-App für deine Zimmer- und Gartenpflanzen – Botanical-Warmth-Design mit KI-Bestimmung, Gesundheitsanalyse, interaktivem KI-Botaniker und saisonaler Pflege über die Mistral-API."
  long_description: "Private Android-App (Kotlin + Compose, Hilt, Room) im Botanical-Warmth-Design zur liebevollen Verwaltung deiner Zimmer- und Gartenpflanzen. Alle Pflanzen, Fotos und Einstellungen bleiben ausschließlich lokal auf dem Gerät (Room + DataStore) – keine Nutzerkonten, keine Cloud, keine Telemetrie. KI-Features laufen über die Mistral-API, der Key wird nur lokal gespeichert."
  features:
    - "Flexibel erfassen: direkt per Kamera, aus der Galerie oder komplett manuell; KI-Fotoanalyse (pixtral-12b-latest) bestimmt Art, deutschen Namen, Familie, saisonale Pflegehinweise und Gesundheitszustand mit konkreten Handlungsschritten"
    - "KI-Pflegeplan ohne Foto: Namen oder Art eingeben – der komplette botanische Steckbrief wird per KI ausgefüllt"
    - "Interaktiver KI-Botaniker in der Detailansicht („Warum werden Blattspitzen braun?“, „Giftig für Haustiere?“, „Wann umtopfen?“) mit Schnellfragen-Chips und vollem Pflanzen- & Saisonkontext"
    - "Smarter Garten-Check mit täglichen saisonalen Pflegetipps; dynamische Wasser-/Licht-/Luftfeuchte-/Temperatur-Badges; Volltext-Suche und Sortierung (A–Z, Neu)"
    - "4 Farbschemata (jeweils Light & Dark), adaptives & monochromes App-Icon inkl. Android-13-Themed-Icons; alle KI-Felder manuell editierbar; Markdown-Diagnose-Report"
    - "Kotlin 2.4, Compose Material 3, MVVM/UDF (StateFlow), Hilt, Room, DataStore, Retrofit 3 + kotlinx.serialization"
  language: Kotlin
  repo: "https://github.com/gschmalzhaf-cell/PlanzenR-mer"
  website: ""

- name: Gideon's Einkaufsliste
  icon: "🛒"
  slug: einkaufsliste
  app_icon: "assets/icons/einkaufsliste/icon.svg"
  description: "Private, intelligente Android-Einkaufsliste im „Cozy Seasons“-Design – lokal ohne Account, mit Supermarkt-Sortierung, Mengen-Zusammenführung und optionaler Mistral-KI für Foto-, Rezept- und Menü-Erkennung."
  long_description: "Private Android-Einkaufsliste im „Cozy Seasons“-Design – komplett lokal in Room, ohne Account oder Cloud. Vier Wege, Einträge zu ergänzen: manuell mit Smart-Eingabe, per KI-/Saison-Assistent, per Foto (Mistral Vision oder ML Kit offline) oder aus Rezept/Link (Schema.org/JSON-LD mit exakten Mengen)."
  features:
    - "Supermarkt-Gang-Sortierung: Artikel werden offline automatisch 11 deutschen Abteilungen zugeordnet (Obst & Gemüse … Sonstiges), per Toggle in der Kopfzeile umschaltbar"
    - "Automatische Duplikat- & Mengen-Zusammenführung: 200 g + 300 g Mehl werden zu 500 g addiert (inkl. g↔kg, ml↔l, Stückzahlen)"
    - "Smart-Schnelleingabe & Autocomplete: „2 kg Kartoffeln #Sonntag“ – Menge, Artikel, #Tag, Abteilung und Packungsgröße werden sofort erkannt"
    - "KI- & Saison-Assistent: aus Gericht oder Anlass („Lasagne für 4 Personen“) eine komplette Liste mit Mengen generieren – mit Mistral-Key oder offline mit saisonalen Basics"
    - "Foto-Erkennung von Zetteln/Produkten via Mistral Vision oder offline ML Kit Text Recognition; Rezepte per Text oder URL mit strukturierten Daten (Schema.org/JSON-LD)"
    - "Cozy-Seasons-UI mit Jahreszeiten-Paletten, Konfetti & Feder-Physik; Tags & Sofort-Filter; verschlüsselter API-Key mit „✨ KI aktiv“-Badge; Markdown-Diagnosebericht"
    - "Signierte Release-APK automatisch via GitHub Actions bei jedem Push auf main (Releases-Tab)"
  language: Kotlin
  repo: "https://github.com/gschmalzhaf-cell/Einkaufsliste"
  website: ""

- name: Gideon's Putzplan
  icon: "🧹"
  slug: putzplan
  app_icon: "assets/icons/putzplan/icon.svg"
  description: "Selbstlernende Android-App für Haushalts- & Putzplan – komplett offline ohne Account: adaptive Intervalle, Zeitbudget-Modus, Smart-Runden und Foto-Analyse per Mistral Vision."
  long_description: "Native, selbstlernende Android-App für deinen Haushalts- und Putzplan – komplett offline-fähig, ohne Server und ohne Account; alle Daten lokal in einer Room-Datenbank. Mit dynamischer Priorisierung, Stoppuhr, adaptiven Intervallen, Zeitbudget-Modus (Knapsack-Optimierung), Smart-Runden, Foto-Analyse per Mistral Vision sowie Gewohnheiten & Badges."
  features:
    - "Wochenplan mit dynamischer Priorisierung (Verzug relativ zur Intervalllänge), Wochenfortschritt & Tagesgruß, Stoppuhr mit Pause, vollständige Aufgaben- & Raumverwaltung mit eigenen Farben"
    - "Lern-Logik: adaptive Intervalle aus realen Abständen (Median), gewichtetes Dauer-Lernen, 3× übersprungen → automatisch seltener eingeplant"
    - "Zeitbudget-Modus (5/10/20/30 Min.) per 0/1-Knapsack-Optimierung inkl. Ein-Tipp-Erledigen; Smart-Runden (Synergie nach Hilfsmittel/Raum); Kontext-Modi (Besuch?, ≤10 Min., Saison-Tipp, Wochenende)"
    - "Smart-Assistent beim Anlegen: Offline-Wissensbasis schlägt Raum, Intervall, Dauer, Hilfsmittel und Anleitung vor; optional „Mit KI ausfüllen“ via Mistral"
    - "Foto-Analyse mit Mistral Vision: bis zu 8 Fotos, automatische Aufgaben- & Raum-Erkennung inkl. Duplikat-Schutz und Foto→Plan-Kopplung; API-Key nur lokal gespeichert"
    - "Verlauf, Gewohnheiten (Wochen-Streak, stärkster Putztag & Tageszeit) und Erfolgs-Badges; Markdown-Diagnose-Report"
    - "Kotlin, Compose Material 3, Room (DB v2), WorkManager, StateFlow"
