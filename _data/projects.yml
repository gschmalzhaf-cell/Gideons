- name: Gideon's Bücherwelt
  icon: "📚"
  slug: buecherwelt
  app_icon: "assets/icons/buecherwelt/icon.png"
  description: "Deine persönliche Bücherwelt: Bücher erfassen, ordnen und bewerten – damit kein gutes Buch mehr verloren geht."
  long_description: "Android-App (Kotlin + Jetpack Compose, MVVM) zur Verwaltung deiner persönlichen Bibliothek und zum Entdecken neuer Bücher. 100 % lokal (Room + DataStore) und offline-fähig – Netzwerk wird nur für ISBN-Abfragen (Google Books / Open Library), Cover-Downloads und optionale LLM-Aufrufe genutzt."
  features:
    - "Bücher per ISBN-Kamera-Scan (ML Kit), manueller ISBN oder komplett manuell erfassen; Buchdaten automatisch via Google Books / Open Library, Duplikate werden erkannt und zusammengeführt"
    - "Metadaten & Tags: eigener Tropes-Katalog mit Autovervollständigung, Bewertung 1–5, Lesestatus, Spice-Level, Genre, Notizen, Serien/Reihen mit Band-Nr., StoryGraph-CSV-Import, Cover direkt ersetzen"
    - "Statistik-Dashboard: Top-Genres, Top-Tropes, Lieblingsautor:innen, Ø Bewertungen, Genre-Verteilung und „Weniger beliebt“-Signale"
    - "Entdecken: regelbasierte und LLM-Empfehlungen mit Begründung, KI-Re-Ranking, „Ähnliche Bücher“ pro Buch und Merkliste"
    - "Optionale KI-Features: semantische Freitext-Suche („düstere Bücher mit Happy End“) und spoilerfreie KI-Einblicke mit „Passt zu deinem Profil“-Score"
    - "App-Report als Markdown/JSON (API-Key wird redacted) – nichts verlässt das Gerät"
  language: Kotlin
  repo: "https://github.com/gschmalzhaf-cell/Gideon-s-B-cherwelt"
  website: ""

- name: Gideon's Übersetzer
  icon: "🌐"
  slug: uebersetzer
  app_icon: "assets/icons/uebersetzer/icon.png"
  description: "Englische PDF-/EPUB-/DOCX-Dokumente lokal ins Deutsche übersetzen und als EPUB für den Tolino erzeugen – offline mit llama.cpp."
  long_description: "Windows-Anwendung, die englischsprachige Dokumente (PDF, EPUB, DOCX) ins Deutsche übersetzt und daraus eine EPUB-Datei für den Tolino-E-Book-Reader erzeugt. Mehrere Dokumente lassen sich als Warteschlange nacheinander abarbeiten (GUI und CLI). Ohne eingeschalteten Online-Betrieb verlässt kein Buchinhalt das Gerät."
  features:
    - "Übersetzt PDF, EPUB und DOCX ins Deutsche und erzeugt gültiges EPUB 3 (nav + NCX, deutsche Anführungszeichen, Titelseite) für den Tolino"
    - "Standard: komplett offline mit eingebettetem llama.cpp (Qwen2.5-7B, alternativ TranslateGemma 4B/12B); Modell wird einmalig heruntergeladen"
    - "Optionaler Online-Notnagel: Mistral-API (Streaming) und Mistral OCR für Scans – wird niemals automatisch aktiviert"
    - "PySide6-GUI mit Drag & Drop, Fortschrittsbalken, Live-Textprobe, Abbrechen und Erststart-Assistent; CLI mit Warteschlange für mehrere Dokumente"
    - "JSON-Zwischenspeicher: abgebrochene Übersetzungen fortsetzen"
    - "Auto-Update-Prüfung, Diagnose-Report (Markdown + JSON), PyInstaller + Inno-Setup-Installer; CI baut den Installer bei jedem Push"
  language: Python
  repo: "https://github.com/gschmalzhaf-cell/Gideon-s-bersetzer"
  website: ""

- name: Gideon's Notizen
  icon: "📝"
  slug: notizen
  app_icon: "assets/icons/notizen/icon.png"
  description: "Open-Source Meeting-Notizen für macOS und Windows: Bildschirmaufnahme, Zeitstempel-Wiedergabe, lokale KI und optional Mistral API – kein Konto nötig."
  long_description: "Local-first Meeting-Notizen für macOS und Windows mit eigenem cozy-blauem Design und eigenem App-Icon: Screen und Meeting-Audio aufnehmen, bearbeitbare Notizen erhalten – per Klick auf einen Zeitstempel springst du zur Wiedergabe genau dieses Moments. Transkription, Notizen und Ask AI laufen lokal auf deinem Rechner (Ollama) oder optional über die Mistral API. Kein Konto, kein API-Key nötig (außer im optionalen Online-Modus)."
  features:
    - "On-device-Transkription über lokales Ollama – 27 Meeting-Sprachen; optional eigener Mistral-API-Key für Notizen & Ask AI"
    - "Multi-Track-Aufnahme: Screen, Mikrofon („Me“) und System-Audio („Them“) als getrennte Streams"
    - "Replay: Klick auf einen Zeitstempel in den Notizen springt zum entsprechenden Videomoment"
    - "Bearbeitbare Notizen mit wählbaren Protokoll-Typen; Export als PDF, Word oder Markdown"
    - "Ask AI über alle Meetings hinweg – on-device oder via Mistral API"
    - "Kalender (Google/Microsoft) mit Auto-Record (Off/Once/Series) und Meeting-Erkennung für Zoom, Meet, Teams, Webex, Slack"
    - "Volltextsuche über alle Transkripte mit Deep-Links; AES-256-GCM-Verschlüsselung at rest (Keychain/DPAPI)"
    - "Fork-Features: Launch-at-Login als sichtbarer Toggle, Ein-Klick-Diagnosebericht (Markdown), In-App-Updates über die Releases dieses Repos"
  language: TypeScript
  repo: "https://github.com/gschmalzhaf-cell/AutoDoc"
  website: ""

- name: Gideon's RömerPlant
  icon: "🌿"
  slug: roemerplant
  app_icon: "assets/icons/roemerplant/icon.svg"
  description: "Private Android-App für deine Pflanzen: Foto-Erfassung, KI-Bestimmung, Pflegeanweisungen und Gesundheitsanalyse – alles lokal gespeichert."
  long_description: "Private Android-App zur Verwaltung deiner Pflanzen – mit Foto- oder manueller Erfassung, KI-gestützter Bestimmung, Pflegeanweisungen und Gesundheitsanalyse über die Mistral-API (pixtral-12b-latest). Entwickelt für private Nutzung: keine Nutzerkonten, keine Cloud, keine Telemetrie."
  features:
    - "Pflanzen per Foto (Photo-Picker) oder komplett manuell erfassen"
    - "Mistral-KI-Analyse: Artbestimmung mit deutscher Beschreibung, Pflegeanweisungen (Licht, Gießen, Luftfeuchtigkeit, Temperatur, Düngen, Substrat) und Gesundheitsanalyse mit konkreten Handlungsanweisungen"
    - "Alle KI-Felder in der Detailansicht manuell überschreibbar; Gesundheit jederzeit neu analysierbar"
    - "Alle Daten lokal auf dem Gerät (Room, DataStore); API-Key wird ausschließlich lokal gespeichert"
    - "Kotlin 2.x, Jetpack Compose Material 3, MVVM mit StateFlow, Hilt, Retrofit + kotlinx.serialization"
  language: Kotlin
  repo: "https://github.com/gschmalzhaf-cell/PlanzenR-mer"
  website: ""

- name: Gideon's Einkaufsliste
  icon: "🛒"
  slug: einkaufsliste
  app_icon: "assets/icons/einkaufsliste/icon.svg"
  description: "Einfache, private Android-Einkaufsliste – lokal ohne Account. Einträge manuell, per Foto oder direkt aus Rezepten mit exakten Mengen."
  long_description: "Eine einfache, private Android-Einkaufsliste für ein Gerät – komplett lokal in einer Room-Datenbank, ohne Account. Artikel lassen sich manuell eintippen, per Foto einer Liste/Notiz erkennen oder direkt aus einem Rezept (inkl. strukturierter Rezeptdaten mit exakten Mengen) übernehmen."
  features:
    - "Einträge manuell, per Foto (ML Kit on-device oder optional Mistral-API) oder aus Rezept-Text/-Link mit strukturierten Daten (Schema.org/JSON-LD)"
    - "Optionale Tags (z. B. „Grillabend“) zum Filtern, Priorisieren sowie Ein- und Ausblenden von Einträgen"
    - "Diagnose-Bericht als kopierbarer Markdown (In-App-Ereignisprotokoll + Absturzaufzeichnung)"
    - "Lokal in Room gespeichert, ohne Account; Material 3 Expressive im Retro-Comic-Look"
    - "Signierte Release-APK automatisch via GitHub Actions bei jedem Push auf main (siehe Releases-Tab)"
