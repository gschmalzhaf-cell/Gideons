  slug: einkaufsliste
  description: "Einfache, private Android-Einkaufsliste – lokal ohne Account. Einträge manuell, per Foto oder direkt aus Rezepten mit exakten Mengen."
  long_description: "Eine einfache, private Android-Einkaufsliste für ein Gerät – komplett lokal in einer Room-Datenbank, ohne Account. Artikel lassen sich manuell eintippen, per Foto einer Liste/Notiz erkennen oder direkt aus einem Rezept (inkl. strukturierter Rezeptdaten mit exakten Mengen) übernehmen."
  features:
