name: Projekte aktualisieren

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: gh-pages auschecken
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyYAML installieren
        run: pip install pyyaml

      - name: Neue Projekte in _data/projects.yml eintragen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: gschmalzhaf-cell
          EXCLUDE_REPOS: Gideons
        run: python scripts/update_projects.py

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/projects.yml
          if git diff --cached --quiet; then
            echo "Keine neuen Projekte – nichts zu committen."
          else
            git commit -m "chore: neue Projekte automatisch in _data/projects.yml ergaenzt"
            git push
          fi
